# Checks that a commit is on a branch of this repository (main, or a release
# branch for maintenance releases), for the release workflows to call before
# the job holding the Artifactory or Docker Hub credentials. GitHub serves
# any commit of the fork network through this repository, so without this a
# commit only pushed to a fork could be built with them. Runs as its own job,
# which gets no secrets.
name: Check Commit

on:
  workflow_call:
    inputs:
      sha:
        description: Full SHA of the commit to check
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-commit:  # zizmor: ignore[concurrency-limits] a concurrency group would cancel queued releases
    runs-on: ubuntu-latest
    steps:
    # The SHA goes through the environment rather than being expanded into
    # scripts, and is checked before anything uses it.
    - name: Check the SHA
      env:
        SHA: ${{ inputs.sha }}
      run: |
        set -euo pipefail
        if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::sha must be a full 40-character commit SHA: $SHA"
          exit 1
        fi

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.sha }}
        # All branches, for the check below.
        fetch-depth: 0
        persist-credentials: false

    - name: Check the commit is on a branch of ${{ github.repository }}
      env:
        SHA: ${{ inputs.sha }}
      run: |
        set -euo pipefail
        branches=$(git branch --remotes --contains "$SHA")
        if [[ -z "$branches" ]]; then
          echo "::error::Commit $SHA is not on any branch of $GITHUB_REPOSITORY"
          exit 1
        fi
        echo "Commit $SHA is on:"
        echo "$branches"
