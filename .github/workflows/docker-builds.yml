name: Test Build Docker Images

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - '**.md'

permissions:
  contents: read

# Superseded runs for the same branch or pull request are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ (github.repository_owner == 'AcademySoftwareFoundation' && 'ubuntu-latest-8c-32g-300h') || 'ubuntu-latest' }}
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
      DOCKER_BUILDKIT: '1'
      # Matrix values go through the environment rather than being expanded
      # into scripts.
      MATRIX_VERSION: ${{ matrix.version }}

    strategy:
      # Don't let a failure for one year affect the others
      fail-fast: false
      matrix:
        include:
          # A bare VFX Platform year version also selects every clang
          # variant of that year (e.g. ci-common:2027-clang21 and
          # ci-common:2027-clang22), as base images need the year's default
          # clang and the per-clang images need all of them.
          - group: vfx-2027
            name: vfx-2027
            version: 2027

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Activate Docker buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        # Use the docker driver so locally built images (e.g. ci-baseos-gl-conan) are
        # visible to subsequent buildx steps via the shared Docker daemon image store,
        # consistent with local development behaviour. The docker-container driver
        # (the default) runs BuildKit in an isolated container with its own image store,
        # causing subsequent steps to pull base images from Docker Hub instead of reusing
        # locally built ones.
        driver: docker
      env:
        BUILDKIT_STEP_LOG_MAX_SIZE: 10485760

    - name: Set up aswfdocker
      uses: $/.github/actions/setup-aswfdocker

    - name: Free up disk space
      run: |
        df -h
        sudo apt-get remove -y '^llvm-.*' '^php.*' '^php8.*' '^cpp.*' '^g\+\+.*' '^clang.*' '^gfortran.*' \
            '^dotnet-.*' '^libmono-.*' '^mono-.*' monodoc-http '^r-.*' '^ruby.*' \
            ant ant-optional aria2 azure-cli firefox google-chrome-stable microsoft-edge-stable powershell \
            imagemagick '^imagemagick-.*' '^libmagickcore-.*' '^libmagickwand-.*'  kubectl mercurial mercurial-common subversion
        sudo apt-get autoremove -y
        sudo apt-get clean
        sudo rm -rf \
            /usr/share/dotnet/ \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /usr/local/julia* \
            /usr/lib/jvm || true
        sudo docker system prune -a
        df -h
        dpkg -l 

    - name: Build Conan Builder Image
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type IMAGE \
          --group baseos-gl-conan \
          --version "$MATRIX_VERSION" \
          --push NO

    - name: Build common packages (OpenSSL/GnuTLS wrappers, Ninja, CMake, every Clang version)
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group common \
          --version "$MATRIX_VERSION" \
          --build-missing \
          --push NO

    - name: Build ci-common Docker Image for downstream images
      run: |
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type IMAGE \
          --group common \
          --version "$MATRIX_VERSION" \
          --push NO

    - name: Build base1 packages
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group base1 \
          --version "$MATRIX_VERSION" \
          --build-missing \
          --push NO

    - name: Build base2 packages (Qt) for ci-baseqt image
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group base2 \
          --version "$MATRIX_VERSION" \
          --build-missing \
          --push NO

    - name: Build base3 packages (PySide) for base image
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group base3 \
          --version "$MATRIX_VERSION" \
          --build-missing \
          --push NO

    - name: Build base and baseqt images
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type IMAGE \
          --group base \
          --version "$MATRIX_VERSION" \
          --push NO

    - name: Build vfx packages
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group vfx \
          --version "$MATRIX_VERSION" \
          --build-missing \
          --push NO

    - name: Build vfx images
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type IMAGE \
          --group vfx \
          --version "$MATRIX_VERSION" \
          --push NO
