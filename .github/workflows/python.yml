name: Test Python aswfdocker Library

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - '**.md'

permissions:
  contents: read

# Superseded runs for the same branch or pull request are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up aswfdocker
      uses: $/.github/actions/setup-aswfdocker
      with:
        dev: 'true'

    - name: Run all pre-commit tests
      run: uv run pre-commit run --all-files

    - name: Check that all templated Dockerfile and README.md are up to date
      run: uv run aswfdocker dockergen --check
