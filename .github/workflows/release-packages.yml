# Builds Conan packages from a given commit and uploads them to Artifactory,
# one job per version. Started by `aswfdocker release -t PACKAGE`, or called
# by release-all.yml (see CONTRIBUTING.md), as only GitHub Actions holds the
# Artifactory credentials (and, in future, the package signing keys).
name: Release Conan Packages
run-name: "Conan packages ${{ inputs.groups }} ${{ inputs.targets }} ${{ inputs.versions }} for ${{ inputs.package_org }} at ${{ inputs.sha }}"

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to build the packages from
        required: true
        type: string
      package_org:
        description: Conan user and Artifactory remote to upload to
        required: true
        type: choice
        options:
          - aswftesting
          - aswf
      groups:
        description: Space-separated package groups
        required: true
        type: string
      versions:
        description: Space-separated versions (e.g. "2026 2027", or "2027-clang22"), each built by its own job
        required: true
        type: string
      targets:
        description: Space-separated packages to build (default the whole groups)
        required: false
        type: string
        default: ""
      force_rebuild:
        description: Rebuild even if Artifactory has an up-to-date binary
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      package_org:
        required: true
        type: string
      groups:
        required: true
        type: string
      versions:
        required: true
        type: string
      targets:
        required: false
        type: string
        default: ""
      force_rebuild:
        required: false
        type: boolean
        default: false
    secrets:
      ARTIFACTORY_USER:
        required: true
      ARTIFACTORY_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  check-release:
    uses: $/.github/workflows/check-release.yml
    with:
      sha: ${{ inputs.sha }}
      org: ${{ inputs.package_org }}
      groups: ${{ inputs.groups }}
      versions: ${{ inputs.versions }}
      targets: ${{ inputs.targets }}

  release:  # zizmor: ignore[concurrency-limits] a concurrency group would cancel queued releases
    needs: check-release
    runs-on: ${{ (github.repository_owner == 'AcademySoftwareFoundation' && 'ubuntu-latest-8c-32g-300h') || 'ubuntu-latest' }}
    strategy:
      # Let the other versions finish uploading their packages, so that
      # re-running the failed jobs only rebuilds what's missing.
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.check-release.outputs.versions) }}
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
      DOCKER_BUILDKIT: '1'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The commit check-release checked.
        ref: ${{ inputs.sha }}
        persist-credentials: false

    - name: Activate Docker buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        # Use the docker driver for consistency with docker-builds.yml and local development.
        driver: docker
      env:
        BUILDKIT_STEP_LOG_MAX_SIZE: 10485760

    - name: Set up aswfdocker
      uses: $/.github/actions/setup-aswfdocker

    - name: Build and upload
      env:
        # Only this step gets the Artifactory credentials, and only the
        # `conan upload` step of the package builds (see
        # packages/common/Dockerfile) gets them from it, as BuildKit secrets.
        CONAN_LOGIN_USERNAME: ${{ secrets.ARTIFACTORY_USER }}
        CONAN_PASSWORD: ${{ secrets.ARTIFACTORY_TOKEN }}
        # Inputs (checked by check-release) go through the environment
        # rather than being expanded into the script.
        PACKAGE_ORG: ${{ inputs.package_org }}
        PACKAGE_GROUPS: ${{ inputs.groups }}
        PACKAGE_VERSION: ${{ matrix.version }}
        PACKAGE_TARGETS: ${{ inputs.targets }}
        FORCE_REBUILD: ${{ inputs.force_rebuild }}
      run: |
        set -euo pipefail
        args=(--ci-image-type PACKAGE --docker-org "$PACKAGE_ORG" --version "$PACKAGE_VERSION" --push YES)
        for group in $PACKAGE_GROUPS; do args+=(--group "$group"); done
        for target in $PACKAGE_TARGETS; do args+=(--target "$target"); done
        if [[ "$FORCE_REBUILD" == "true" ]]; then args+=(--force-rebuild); fi
        uv run aswfdocker --repo-uri "$GITHUB_REPOSITORY" --verbose build "${args[@]}"
