# Builds released ci-image Docker images and pushes them to Docker Hub.
# Conan packages are released by release-packages.yml instead.
name: Release

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  check-commit:
    uses: $/.github/workflows/check-commit.yml
    with:
      sha: ${{ github.sha }}

  release:  # zizmor: ignore[concurrency-limits] a concurrency group would cancel queued releases
    needs: check-commit
    runs-on: ${{ (github.repository_owner == 'AcademySoftwareFoundation' && 'ubuntu-latest-8c-32g-300h') || 'ubuntu-latest' }}
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
      DOCKER_BUILDKIT: '1'
      GITHUB_REF_LOCAL: ${{ github.ref || format('{0}{1}', 'refs/tags/', github.event.release.tag_name) }}

    steps:
    - name: Reject Conan package releases
      if: ${{ contains(github.ref, '/ci-package') }}
      run: |
        echo "::error::Conan packages are released with 'aswfdocker release -t PACKAGE', which runs the Release Conan Packages workflow"
        exit 1

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The commit the release's tag points to, which check-commit checked.
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Activate Docker buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        # Use the docker driver for consistency with docker-builds.yml and local development.
        # All images are pushed to Docker Hub in this workflow so the image store sharing
        # behaviour difference between drivers has no practical effect here.
        driver: docker
      env:
        BUILDKIT_STEP_LOG_MAX_SIZE: 10485760

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: auto

    - name: Set up Python
      run: uv python install 3.10 3.10 3.10

    - name: Install aswfdocker and dependencies
      run: uv sync --frozen

    # Secrets go through the environment of the steps needing them, never on
    # a command line or expanded into a script.
    - name: Login to DockerHub
      env:
        DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      run: printenv DOCKERHUB_PASSWORD | docker login -u aswfdocker --password-stdin

    - name: Build and Push
      run: |
        uv run aswfdocker \
          --repo-uri $GITHUB_REPOSITORY \
          --verbose \
          build \
          --full-name $GITHUB_REF_LOCAL \
          --push YES

    - name: Update Docker Hub Description
      env:
        DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      run: |
        uv run aswfdocker \
          pushoverview \
          --username aswfdocker \
          --full-name $GITHUB_REF_LOCAL
