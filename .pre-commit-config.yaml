repos:
-   repo: local
    hooks:
      - id: black
        name: Check black formatting
        entry: uv run black
        language: system
        types: [python]
      - id: pytest
        name: Check pytest unit tests pass
        entry: uv run pytest python/aswfdocker
        pass_filenames: false
        language: system
        types: [python]
      - id: mypy
        name: Check mypy static types match
        entry: uv run mypy python/aswfdocker
        pass_filenames: false
        language: system
        types: [python]
      - id: pylint
        name: Check linting with pylint
        entry: uv run pylint python/aswfdocker
        pass_filenames: false
        language: system
        types: [python]
      - id: zizmor
        name: Check GitHub Actions workflows and actions with zizmor
        entry: uv run zizmor .github/workflows .github/actions
        pass_filenames: false
        language: system
        files: ^\.github/
      - id: jactionlint
        name: Check GitHub Actions workflows and actions with jactionlint
        entry: uv run jactionlint
        pass_filenames: false
        language: system
        files: ^\.github/
