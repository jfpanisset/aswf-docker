name: "baseqt"
title: "Base with Qt and PySide CI Docker Image"
description: |
  Contains: Python, TBB, Boost, Qt, PySide and other base libraries
packages:
  - b2                 # base1 packages
  - bzip2
  - cppunit
  - expat
  - fmt
  - gtest
  - jsoncpp
  - libbacktrace
  - libcgroup
  - libdeflate
  - libiconv
  - libmicrohttpd
  - libxcrypt
  - lua
  - lz4
  - pugixml
  - pystring
  - random123
  - rapidjson
  - snappy
  - onetbb
  - tsl-robin-map
  - yaml-cpp
  - zlib
  - zstd
  - c-blosc
  - cpython
  - freetype
  - gdbm
  - glew
  - glfw
  - log4cplus
  - minizip-ng
  - nanobind
  - boost
  - pybind11
  - libjpeg-turbo
  - libwebp
  - md4c
  - qt                 # base2 packages
  - pyside             # base3 packages
implicit_packages:
  - numpy
  - vfxplatform
docker_from: ${ASWF_ORG}/ci-common:${CI_COMMON_VERSION}-clang${ASWF_CLANG_MAJOR_VERSION}
docker_package_version: $ASWF_VFXPLATFORM_VERSION
