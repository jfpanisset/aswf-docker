name: "openimageio"
name_image: "oiio" # image is named oiio, Conan package is opeaimageion
title: "OpenImageIO CI Docker Image"
description: |
  Contains: Python, OpenEXR, Partio and other OpenImageIO upstream dependencies
  Warning: this image does *not* contain OpenImageIO itself as it is used to *build* OpenImageIO!
packages:
  - qt # hidden dependency for building iv
  - libjxl      # allow OIIO 3.x to build in VFX 2023 / 2024
  - libultrahdr # allow OIIO 3.x to build in VFX 2023 / 2024
  - openjph     # allow OIIO 3.x to build in VFX 2023 / 2024
  - openimageio # all dependencies will be installed except openimageio itself
implicit_packages:
  - numpy
  - vfxplatform
docker_from: ${ASWF_ORG}/ci-common:${ASWF_VFXPLATFORM_VERSION}-clang${ASWF_CLANG_MAJOR_VERSION}.${ASWF_VFXPLATFORM_MINOR_VERSION}
docker_package_version: $ASWF_VFXPLATFORM_VERSION
