name: "openfx"
title: "OpenFX CI Docker Image"
description: |
  Contains: Python and other OpenFX upstream dependencies
  Warning: this image does *not* contain OpenFX itself as it is used to *build* OpenFX!
packages:
  - openfx # all dependencies will be installed except openfx itself
implicit_packages:
  - numpy
  - vfxplatform
docker_from: ${ASWF_ORG}/ci-common:${ASWF_VFXPLATFORM_VERSION}-clang${ASWF_CLANG_MAJOR_VERSION}.${ASWF_VFXPLATFORM_MINOR_VERSION}
docker_package_version: $ASWF_VFXPLATFORM_VERSION
