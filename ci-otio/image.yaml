name: "opentimelineio"
name_image: "otio" # image is named otio, Conan package is opentimelineio
title: "OpenTimelineIO CI Docker Image"
description: |
  Contains: Imath, RapidJSON and other OpenTimelineIO upstream dependencies
  Warning: this image does *not* contain OpenTimelineIO itself as it is used to *build* OpenTimelineIO!
packages:
  - minizip-ng     # upcoming OTIO versions will need this, 0.18.1 does not yet
  - opentimelineio # all dependencies will be installed except opentimelineio itself
implicit_packages:
  - numpy
  - vfxplatform
docker_from: ${ASWF_ORG}/ci-common:${ASWF_VFXPLATFORM_VERSION}-clang${ASWF_CLANG_MAJOR_VERSION}.${ASWF_VFXPLATFORM_MINOR_VERSION}
docker_package_version: $ASWF_VFXPLATFORM_VERSION
docker_post_commands: |
  RUN pip3 install flake8 tox urllib3
