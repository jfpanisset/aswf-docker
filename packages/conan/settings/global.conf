#run_to_file = False         # environment CONAN_LOG_RUN_TO_FILE
#level = critical            # environment CONAN_LOGGING_LEVEL
#print_run_commands = False  # environment CONAN_PRINT_RUN_COMMANDS

#[general]
#revisions_enabled = 1
core:default_build_profile = vfx2026
core:default_profile = vfx2026
core.gzip:compresslevel = 9
tools.system.package_manager:sudo = True
core.net.http:timeout = 60
# Rebuild every consumer whenever a dependency's version, recipe (conanfile.py,
# conandata.yml) or exported patches change: full_mode puts the dependency's
# full version, recipe revision and package_id into the consumer's package_id,
# so the rebuild cascades transitively, not just one level. We don't trust ABI
# stability across minor/patch versions, nor that a "library" never ships
# inline code in its public headers.
core.package_id:default_unknown_mode = full_mode
core.package_id:default_non_embed_mode = full_mode
core.package_id:default_embed_mode = full_mode

# When we conan install we want everything
tools.graph:skip_binaries = False

# FIXME don't repeat yourself use jinja2 env vars
core.cache:storage_path = /opt/conan_home/d
core.download:download_cache = /tmp/downloads

