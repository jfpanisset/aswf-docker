# Conan packages built once for every clang version in a year's
# clang_versions (as version "<year>-clang<major>"), rather than once per
# year. Every other package is built for each year that pins its version.
per_clang_packages:
  - clang

# Every CI image, built for each year as version "<year>.<minor>", or with
# per_clang: true, for each of the year's clang_versions as
# "<year>-clang<major>.<minor>". exclude_versions lists years an image isn't
# built for.
ci-images:
  baseos-gl-conan: {}
  common:
    per_clang: true
  base: {}
  baseqt: {}
  imath: {}
  openexr: {}
  openfx: {}
  ocio: {}
  oiio: {}
  opencue: {}
  rez: {}
  rawtoaces: {}
  usd: {}
  otio: {}
  materialx: {}
  openrv:
    exclude_versions: ["2023"]
  osl:
    per_clang: true
  openvdb:
    per_clang: true
  vfxall:
    per_clang: true
  moonray: {}
groups:
  package:
      common:
        - openssl
        - gnutls
        - cmake
        - ninja
        - clang
      base1:
        - brotli
        - gdbm
        - icu
        - libdrm
        - libffi
        - libpng
