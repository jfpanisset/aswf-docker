  # VFX Platform year entries, one per supported year:
  #   major_version: the VFX Platform year; images are tagged with it and
  #     Conan packages are built with the vfx<year> Conan profile.
  #   minor_version: the year's current release. Images are tagged
  #     "<year>.<minor>" (or "<year>-clang<major>.<minor>"), and Conan
  #     packages are built in the vfx<year>_<minor> channel, in the
  #     ci-baseos-gl-conan:<year>.<minor> image: bumping it starts a release
  #     whose packages are all rebuilt, never reusing a previous release's.
  #   legacy_common_version: ci-common and ci-baseos-gl-conan images are also
  #     tagged with this pre-2028 ci_common version (e.g. ci-common:7-clang22
  #     as well as ci-common:2027-clang22) for existing consumers. Years from
  #     2028 on don't set it.
  #   tags: extra tags (e.g. "latest") for the year's images.
  #   clang_versions: every clang version (major: full version) built for the
  #     year. A "<year>-clang<major>" version is derived for each, for the
  #     per-clang images in ci-images and the per_clang_packages below. The
  #     last one listed is also tagged with the bare year.
  #   package_versions: version pins. ASWF_CLANG_MAJOR_VERSION is the clang
  #     version everything not built per clang version uses.
  "2023":
    major_version: "2023"
